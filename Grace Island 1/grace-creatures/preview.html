<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>生物 3D 預覽</title>
<style>
:root{color-scheme:light;--ink:#233c46;--muted:#526b74;--deep:#245b59;--line:#d7e4df;--serif:"Noto Serif TC","PMingLiU","Songti TC",serif;--body:"Noto Sans TC","Microsoft JhengHei","PingFang TC",system-ui,sans-serif}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:#d3e6e6;color:var(--ink);font-family:var(--body);overflow:hidden}
button,select{font:inherit;color:inherit;cursor:pointer}
#stage{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#stage:active{cursor:grabbing}
.panel{position:fixed;background:#f8fbf5f0;border:1px solid #ffffffdb;box-shadow:0 10px 35px #12364024}
.card{left:max(18px,env(safe-area-inset-left));top:calc(18px + env(safe-area-inset-top));width:min(280px,calc(100vw - 32px));padding:16px 18px;border-radius:22px}
.eyebrow{color:var(--deep);font-size:12px;font-weight:750;letter-spacing:.12em;margin:0 0 6px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.eyebrow select{border:1px solid var(--line);border-radius:9px;background:#fff;padding:3px 6px;font-size:12px;font-weight:700}
.card h1{font:700 23px/1.3 var(--serif);margin:0 0 4px}
.card p{margin:0;color:var(--muted);font-size:12px;line-height:1.6}
.status{margin-top:8px!important;color:var(--deep)!important;font-weight:750}
.settings{right:max(18px,env(safe-area-inset-right));top:calc(18px + env(safe-area-inset-top));width:min(260px,calc(100vw - 32px));padding:14px 16px;border-radius:22px;max-height:calc(100dvh - 130px);overflow:auto}
.settings h2{font-size:13px;margin:0 0 8px;color:var(--deep);letter-spacing:.1em}
.field{display:grid;gap:4px;margin:0 0 11px;font-size:12px;font-weight:700}
.field .row{display:flex;justify-content:space-between;color:var(--ink)}
.field .row span:last-child{color:var(--muted);font-weight:600}
.field input[type=range]{width:100%;accent-color:var(--deep)}
.field select{border:1px solid var(--line);border-radius:10px;background:#fff;padding:7px 8px;font-size:13px}
.tog{border:0;border-radius:11px;padding:7px 10px;background:#e7f0eb;font-weight:700;font-size:12px}
.tog[aria-pressed=true]{background:var(--deep);color:#fff}
.help{font-size:11px;color:var(--muted);line-height:1.6;margin:4px 0 0}
.nav{display:flex;flex-wrap:wrap;justify-content:center;gap:4px;padding:6px;bottom:calc(18px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);border-radius:20px;width:max-content;max-width:calc(100vw - 24px)}
.nav button{border:0;border-radius:13px;background:transparent;min-height:42px;padding:8px 13px;font-size:13px;font-weight:700}
.nav button:hover{background:#e3eee8}
.nav button[aria-pressed=true]{background:var(--deep);color:#fff}
.nav .sep{width:1px;background:var(--line);margin:6px 2px}
.pad{right:max(18px,env(safe-area-inset-right));bottom:calc(90px + env(safe-area-inset-bottom));padding:6px;border-radius:18px;display:grid;grid-template-columns:repeat(3,44px);gap:4px}
.pad button{border:0;border-radius:12px;background:#e7f0eb;height:44px;font-weight:800;touch-action:none;user-select:none}
.pad button:active{background:var(--deep);color:#fff}
@media(max-width:700px){.settings{top:auto;bottom:calc(150px + env(safe-area-inset-bottom));max-height:34dvh}.card{padding:11px 14px}.card h1{font-size:19px}.nav button{padding:6px 9px;font-size:12px;min-height:38px}.pad{bottom:auto;top:calc(150px + env(safe-area-inset-top))}}
</style>
</head>
<body>
<canvas id="stage" tabindex="0" aria-label="生物 3D 模型，可拖曳旋轉、滾輪縮放"></canvas>
<div class="panel card">
  <p class="eyebrow"><span>GRACE ISLAND · 生物預覽</span><select id="pick" aria-label="選擇生物"></select></p>
  <h1 id="name"></h1>
  <p id="blurb"></p>
  <p class="status" id="status"></p>
</div>
<div class="panel settings" id="settings" aria-label="游泳與移動設定"></div>
<div class="panel nav" role="toolbar" aria-label="動作與視角">
  <span id="actions" style="display:contents"></span>
  <span class="sep"></span>
  <button id="t-follow" aria-pressed="true">鏡頭跟隨</button>
  <button id="t-water" aria-pressed="true">水面</button>
  <button id="t-pause" aria-pressed="false">暫停</button>
  <button id="t-reset">重設視角</button>
</div>
<div class="panel pad" id="pad" hidden>
  <span></span><button data-k="fwd:1">▲</button><span></span>
  <button data-k="turn:-1">◀</button><button data-k="jump">跳</button><button data-k="turn:1">▶</button>
  <button data-k="dive:-1">浮</button><button data-k="fwd:-1">▼</button><button data-k="dive:1">潛</button>
</div>

<script src="lib/three.r128.min.js"></script>
<script src="lib/OrbitControls.r128.js"></script>
<script src="shared/kit.js"></script>
<script src="shared/stage.js"></script>
<script src="shared/swim.js"></script>
<script src="shared/fish.js"></script>
<script src="shared/shark.js"></script>
<script src="shared/ray.js"></script>
<script src="creatures/manifest.js"></script>
<script>
/* load creatures/<id>/model.js + behavior.js for every id in the manifest, then start */
const load=src=>new Promise((ok,no)=>{const s=document.createElement('script');s.src=src;s.onload=ok;s.onerror=()=>no(new Error('載入失敗：'+src));document.head.appendChild(s)});
(async()=>{
  for(const id of GC.manifest){await load(`creatures/${id}/model.js`);await load(`creatures/${id}/behavior.js`)}
  start();
})().catch(e=>{document.getElementById('status').textContent=e.message});

function start(){
  const $=id=>document.getElementById(id);
  const stage=GC.createStage($('stage'));
  const input={fwd:0,turn:0,dive:0};
  let cur=null,paused=false;
  const pick=$('pick');
  for(const id of GC.manifest){const o=document.createElement('option');o.value=id;o.textContent=GC.creatures[id].name;pick.appendChild(o)}
  pick.onchange=()=>spawn(pick.value);

  function resetView(){const off=(cur.def.camera&&cur.def.camera.offset)||[12,6,14],p=cur.rig.g.position;
    stage.controls.target.copy(p);stage.camera.position.set(p.x+off[0],p.y+off[1],p.z+off[2]);stage.setFocus($('t-follow').getAttribute('aria-pressed')==='true'?cur.rig.g:null)}

  function spawn(id){
    if(cur)stage.scene.remove(cur.rig.g);
    const def=GC.creatures[id],settings={};
    (def.settings||[]).forEach(s=>settings[s.key]=s.value);
    const rig=def.make();stage.scene.add(rig.g);
    const brain=def.brain?def.brain(rig,{settings,input,fx:stage.fx}):{update(){},act(){},status:''};
    cur={def,rig,brain,settings};
    $('name').textContent=`${def.name} ${def.en||''}`;$('blurb').textContent=def.blurb||'';
    buildSettings(def,settings);buildActions(def);resetView();
  }

  function buildSettings(def,settings){
    const box=$('settings');box.innerHTML='<h2>游泳與移動設定</h2>';
    for(const s of def.settings||[]){
      const f=document.createElement('label');f.className='field';
      if(s.type==='range'){
        f.innerHTML=`<span class="row"><span>${s.label}</span><span></span></span><input type="range" min="${s.min}" max="${s.max}" step="${s.step}" value="${s.value}">`;
        const inp=f.querySelector('input'),out=f.querySelector('.row span:last-child');
        const show=()=>out.textContent=(+inp.value).toFixed(s.step<1?1:0)+(s.unit||'');show();
        inp.oninput=()=>{settings[s.key]=+inp.value;show()};
      }else if(s.type==='select'){
        f.innerHTML=`<span class="row"><span>${s.label}</span></span><select>${s.options.map(([v,l])=>`<option value="${v}">${l}</option>`).join('')}</select>`;
        const sel=f.querySelector('select');sel.value=s.value;
        sel.onchange=()=>{settings[s.key]=sel.value;syncManual()};
      }else if(s.type==='toggle'){
        f.innerHTML=`<span class="row"><span>${s.label}</span><button type="button" class="tog" aria-pressed="${s.value}">${s.value?'開':'關'}</button></span>`;
        const b=f.querySelector('button');b.onclick=e=>{e.preventDefault();settings[s.key]=!settings[s.key];b.setAttribute('aria-pressed',settings[s.key]);b.textContent=settings[s.key]?'開':'關'};
      }
      box.appendChild(f);
    }
    if(def.controlsHelp){const h=document.createElement('p');h.className='help';h.id='help';h.textContent='手動操控：'+def.controlsHelp;box.appendChild(h)}
    syncManual();
  }
  function syncManual(){const m=cur&&cur.settings.path==='manual';$('pad').hidden=!m;const h=$('help');if(h)h.style.fontWeight=m?'700':'400'}

  function buildActions(def){
    const box=$('actions');box.innerHTML='';
    for(const [k,l] of def.actions||[]){const b=document.createElement('button');b.textContent=l;b.onclick=()=>cur.brain.act(k);box.appendChild(b)}
  }

  $('t-follow').onclick=e=>{const v=e.currentTarget.getAttribute('aria-pressed')!=='true';e.currentTarget.setAttribute('aria-pressed',v);stage.setFocus(v?cur.rig.g:null)};
  $('t-water').onclick=e=>{const v=e.currentTarget.getAttribute('aria-pressed')!=='true';e.currentTarget.setAttribute('aria-pressed',v);stage.setWater(v)};
  $('t-pause').onclick=e=>{paused=!paused;e.currentTarget.setAttribute('aria-pressed',paused);e.currentTarget.textContent=paused?'繼續':'暫停'};
  $('t-reset').onclick=()=>resetView();

  /* manual steering: keyboard + on-screen pad */
  const KEYS={KeyW:['fwd',1],ArrowUp:['fwd',1],KeyS:['fwd',-1],ArrowDown:['fwd',-1],KeyA:['turn',-1],ArrowLeft:['turn',-1],KeyD:['turn',1],ArrowRight:['turn',1],KeyQ:['dive',-1],KeyE:['dive',1]};
  const held={};
  const recompute=()=>{input.fwd=input.turn=input.dive=0;for(const k in held)if(held[k]){const[a,v]=k.split(':');input[a]+=+v}};
  addEventListener('keydown',e=>{if(e.target.tagName==='SELECT'||e.target.tagName==='INPUT')return;
    if(e.code==='Space'){e.preventDefault();cur.brain.act('breach');return}
    const m=KEYS[e.code];if(m){e.preventDefault();held[m.join(':')]=true;recompute()}});
  addEventListener('keyup',e=>{const m=KEYS[e.code];if(m){held[m.join(':')]=false;recompute()}});
  document.querySelectorAll('#pad button').forEach(b=>{const k=b.dataset.k;
    if(k==='jump'){b.onclick=()=>cur.brain.act('breach');return}
    b.onpointerdown=e=>{b.setPointerCapture(e.pointerId);held[k]=true;recompute()};
    b.onpointerup=b.onpointercancel=()=>{held[k]=false;recompute()}});

  spawn(GC.manifest[0]);
  const clock=new THREE.Clock();let simT=0;
  (function tick(){const dt=Math.min(clock.getDelta(),.05);
    if(!paused){simT+=dt;cur.brain.update(simT,dt)}
    stage.update(simT,paused?0:dt);$('status').textContent=cur.brain.status||'';
    requestAnimationFrame(tick)})();
  window.__preview={stage,get cur(){return cur},input};
}
</script>
</body>
</html>
